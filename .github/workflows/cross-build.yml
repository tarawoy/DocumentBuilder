name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  bundle:
    name: Build for aarch64-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Download arm64 glibc (Ubuntu 22.04)
        run: |
          mkdir -p glibc
          cd glibc
          BASE="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          for url in \
            "$BASE/g/glibc/libc6_2.35-0ubuntu3.13_arm64.deb" \
            "$BASE/g/gcc-12/libgcc-s1_12.3.0-1ubuntu1~22.04.3_arm64.deb" \
            "$BASE/g/gcc-12/libstdc++6_12.3.0-1ubuntu1~22.04.3_arm64.deb"; do
            curl -fSL --retry 3 "$url" -O
          done

      - name: Extract debs
        run: |
          mkdir -p glibc-extract
          for deb in glibc/*.deb; do dpkg-deb -x "$deb" glibc-extract/; done

      - name: Copy to dist
        run: |
          DEST="dist/opt/onlyoffice/documentbuilder"
          mkdir -p "$DEST/system"
          cp -r official/opt/onlyoffice/documentbuilder/* "$DEST/"
          find glibc-extract -type f -name "*.so*" -exec cp {} "$DEST/system/" \;
          find glibc-extract -type f -name "ld-linux*" | while read f; do
            cp "$f" "$DEST/system/"
            cp "$f" "$DEST/"
          done

      - name: Create wrapper script
        run: |
          cat > dist/xlsx2pdf << 'WRAPPER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          B="$DIR/opt/onlyoffice/documentbuilder"
          cd "$B"
          export LD_LIBRARY_PATH="system:."
          exec ./system/ld-linux-aarch64.so.1 ./x2t "$@"
          WRAPPER
          chmod +x dist/xlsx2pdf

      - name: Package
        run: |
          cd dist && tar -czf ../onlyoffice-documentbuilder-aarch64-musl.tar.gz .
          ls -lh ../*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-documentbuilder-aarch64-musl
          path: onlyoffice-documentbuilder-aarch64-musl.tar.gz
