name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  PRODUCT: onlyoffice-documentbuilder

jobs:
  bundle:
    name: Build for aarch64-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Download arm64 glibc debs
        run: |
          mkdir -p glibc
          cd glibc
          BASE="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          for url in \
            "$BASE/g/glibc/libc6_2.43-2ubuntu2_arm64.deb" \
            "$BASE/g/gcc-14/libgcc-s1_14.2.0-4ubuntu2~24.04.1_arm64.deb" \
            "$BASE/g/gcc-14/libstdc++6_14.2.0-4ubuntu2~24.04.1_arm64.deb"; do
            echo "Fetch: $url"
            curl -fSL --retry 3 "$url" -O
          done

      - name: Extract debs
        run: |
          mkdir -p glibc-extract
          for deb in glibc/*.deb; do
            dpkg-deb -x "$deb" glibc-extract/
            echo "OK: $deb"
          done
          echo "=== Files extracted ==="
          find glibc-extract -type f -name "*.so*" -o -name "ld-*" | sort

      - name: Bundle
        run: |
          BUILDER="opt/onlyoffice/documentbuilder"
          OUTDIR="dist/$BUILDER"
          mkdir -p "$OUTDIR/system"
          cp -r official/$BUILDER/* "$OUTDIR/"
          # Find and copy all .so and linker files
          find glibc-extract -name "*.so*" -exec cp -v {} "$OUTDIR/system/" \;
          find glibc-extract -name "ld-linux-aarch64*" -exec cp -v {} "$OUTDIR/system/" \;
          echo "=== System libs ==="
          ls -la "$OUTDIR/system/"

      - name: Patch interpreter
        run: |
          sudo apt-get install -y -qq patchelf
          B="dist/opt/onlyoffice/documentbuilder"
          LINKER=$(find "$B" -name "ld-linux-aarch64*" -type f | head -1)
          echo "Linker found: $LINKER"
          if [ -n "$LINKER" ]; then
            LNAME=$(basename "$LINKER")
            # Copy to root too
            cp "$LINKER" "$B/"
            for f in $(find "$B" -type f); do
              if readelf -h "$f" 2>/dev/null | grep -q "ELF64.*aarch64"; then
                echo "Patching: $(basename $f)"
                patchelf --set-interpreter "./system/$LNAME" "$f"
                patchelf --set-rpath "\$ORIGIN:\$ORIGIN/system" "$f"
              fi
            done
            echo "=== Verified ==="
            readelf -l "$B/x2t" | grep "INTERP"
          else
            echo "ERROR: No linker found!"
            exit 1
          fi

      - name: Package
        run: |
          cat > dist/xlsx2pdf << 'WRAP'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/opt/onlyoffice/documentbuilder:$DIR/opt/onlyoffice/documentbuilder/system"
          exec "$DIR/opt/onlyoffice/documentbuilder/x2t" "$@"
          WRAP
          chmod +x dist/xlsx2pdf
          cd dist
          tar -czf ../onlyoffice-documentbuilder-aarch64-musl.tar.gz .
          ls -lh ../onlyoffice-documentbuilder-aarch64-musl.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-documentbuilder-aarch64-musl
          path: onlyoffice-documentbuilder-aarch64-musl.tar.gz
