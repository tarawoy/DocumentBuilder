name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  PRODUCT: onlyoffice-documentbuilder

jobs:
  bundle:
    name: Build for aarch64-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Download arm64 glibc debs
        run: |
          mkdir -p glibc
          cd glibc
          BASE="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          for url in \
            "$BASE/g/glibc/libc6_2.43-2ubuntu2_arm64.deb" \
            "$BASE/g/gcc-14/libgcc-s1_14.2.0-4ubuntu2~24.04.1_arm64.deb" \
            "$BASE/g/gcc-14/libstdc++6_14.2.0-4ubuntu2~24.04.1_arm64.deb"; do
            echo "Fetch: $url"
            curl -fSL --retry 3 "$url" -O
          done
          ls -la

      - name: Extract debs
        run: |
          mkdir -p glibc-extract
          for deb in glibc/*.deb; do
            dpkg-deb -x "$deb" glibc-extract/
            echo "OK: $deb"
          done
          find glibc-extract -name "ld-linux*" -o -name "libc.so*" -o -name "libstdc++.so*" -o -name "libgcc_s.so*" | sort

      - name: Bundle
        run: |
          BUILDER="opt/onlyoffice/documentbuilder"
          OUTDIR="dist/$BUILDER"
          mkdir -p "$OUTDIR/system"
          cp -r official/$BUILDER/* "$OUTDIR/"
          cp -r glibc-extract/lib/aarch64-linux-gnu/*.so* "$OUTDIR/system/" 2>/dev/null || true
          cp -v glibc-extract/lib/ld-linux-aarch64* "$OUTDIR/system/" 2>/dev/null || true

      - name: Patch interpreter
        run: |
          sudo apt-get install -y -qq patchelf
          BUILDER="dist/opt/onlyoffice/documentbuilder"
          LINKER=$(find "$BUILDER/system" -name "ld-linux-aarch64*" | head -1)
          LINKER_NAME=$(basename "$LINKER")
          echo "Linker: $LINKER_NAME"
          for f in $(find "$BUILDER" -type f); do
            if readelf -h "$f" 2>/dev/null | grep -q "ELF64.*aarch64"; then
              patchelf --set-interpreter "./system/$LINKER_NAME" "$f"
              patchelf --set-rpath "\$ORIGIN:\$ORIGIN/system" "$f"
            fi
          done
          echo "--- Verified ---"
          readelf -l "$BUILDER/x2t" | grep "INTERP\|interpreter"

      - name: Package
        run: |
          cat > dist/xlsx2pdf << 'WRAP'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/opt/onlyoffice/documentbuilder:$DIR/opt/onlyoffice/documentbuilder/system"
          exec "$DIR/opt/onlyoffice/documentbuilder/x2t" "$@"
          WRAP
          chmod +x dist/xlsx2pdf
          cat > dist/install.sh << 'INST'
          #!/bin/sh
          DEST="${1:-/opt/onlyoffice/documentbuilder}"
          mkdir -p "$DEST"
          cp -r opt/onlyoffice/documentbuilder "$DEST"
          cp xlsx2pdf /usr/local/bin/
          chmod +x /usr/local/bin/xlsx2pdf
          INST
          chmod +x dist/install.sh
          cd dist && tar -czf ../${PRODUCT}-aarch64-musl.tar.gz . && ls -lh ../*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${PRODUCT}-aarch64-musl
          path: ${PRODUCT}-aarch64-musl.tar.gz
