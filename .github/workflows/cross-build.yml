name: 🏗️ Cross-build for aarch64-musl

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build method
        required: true
        default: qemu-alpine
        type: choice
        options:
          - qemu-alpine
          - release-portable
  push:
    branches: [master, main]

env:
  PRODUCT: onlyoffice-documentbuilder

jobs:
  qemu-alpine:
    name: Build via QEMU aarch64 Alpine
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'qemu-alpine' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in aarch64 Alpine container
        run: |
          mkdir -p output
          docker run --rm --privileged \
            -v $PWD:/workspace \
            -v $PWD/output:/output \
            arm64v8/alpine:3.21 /bin/sh -c "
            set -e
            echo '=== Installing build deps ==='
            apk add --no-cache build-base git curl cmake linux-headers \
              icu-dev boost-dev openssl-dev zlib-dev freetype-dev \
              libpng-dev libjpeg-turbo-dev expat-dev libxml2-dev patchelf
            
            cd /workspace
            
            echo '=== Building 3rd Party ==='
            cd core/Common/3dParty
            bash make.sh || true
            cd /workspace
            
            echo '=== Building core ==='
            cd core
            make -j\$(nproc) all ext || true
            cd /workspace
            
            echo '=== Building sdkjs ==='
            cd sdkjs
            make -j\$(nproc) || true
            cd /workspace
            
            echo '=== Installing ==='
            mkdir -p /output/opt/onlyoffice/documentbuilder
            make install DEST_DIR=/output/opt/onlyoffice/documentbuilder || true
            
            echo '=== Done ==='
            ls -la /output/
            "

      - name: Package artifact
        run: |
          cd output
          tar -czf ../${PRODUCT}-aarch64-musl.tar.gz .
          ls -lh ../${PRODUCT}-aarch64-musl.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${PRODUCT}-aarch64-musl
          path: ${PRODUCT}-aarch64-musl.tar.gz

  release-portable:
    name: Package official release for musl
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-portable'

    steps:
      - name: Download official aarch64 release
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Package with wrapper scripts
        run: |
          mkdir -p output/opt/onlyoffice/documentbuilder
          cp -r official/opt/onlyoffice/documentbuilder/* output/opt/onlyoffice/documentbuilder/
          
          # Create wrapper script
          cat > output/xlsx2pdf << 'WRAPPER'
          #!/bin/sh
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          BUILDER="${SCRIPT_DIR}/opt/onlyoffice/documentbuilder"
          LD_LIBRARY_PATH="${BUILDER}:${LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          INPUT="$1"
          OUTPUT="${2:-${INPUT%.xlsx}.pdf}"
          "${BUILDER}/x2t" "${INPUT}" "${OUTPUT}"
          WRAPPER
          chmod +x output/xlsx2pdf
          
          tar -czf ${PRODUCT}-aarch64-musl-portable.tar.gz -C output .
          ls -lh ${PRODUCT}-aarch64-musl-portable.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${PRODUCT}-aarch64-musl-portable
          path: ${PRODUCT}-aarch64-musl-portable.tar.gz
