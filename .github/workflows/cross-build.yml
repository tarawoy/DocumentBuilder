name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  bundle:
    name: Build for aarch64-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Get arm64 glibc
        run: |
          mkdir -p glibc
          cd glibc
          BASE="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          wget -q "$BASE/g/glibc/libc6_2.39-0ubuntu8.7_arm64.deb"
          wget -q "$BASE/g/gcc-14/libgcc-s1_14.2.0-4ubuntu2~24.04.1_arm64.deb"
          wget -q "$BASE/g/gcc-14/libstdc++6_14.2.0-4ubuntu2~24.04.1_arm64.deb"

      - name: Extract debs
        run: |
          mkdir -p glibc-extract
          for deb in glibc/*.deb; do dpkg-deb -x "$deb" glibc-extract/; done

      - name: Dist
        run: |
          mkdir -p dist/opt/onlyoffice/documentbuilder/system
          cp -r official/opt/onlyoffice/documentbuilder/* dist/opt/onlyoffice/documentbuilder/
          for f in $(find glibc-extract -type f -name "*.so*"); do cp "$f" dist/opt/onlyoffice/documentbuilder/system/; done
          for f in $(find glibc-extract -type f -name "ld-linux*"); do cp "$f" dist/opt/onlyoffice/documentbuilder/system/; cp "$f" dist/opt/onlyoffice/documentbuilder/; done
          # Symlink libstdc++ - only match numeric .so files, NOT gdb.py
          cd dist/opt/onlyoffice/documentbuilder/system
          for v in libstdc++.so.6.0.33 libstdc++.so.6.0.32 libstdc++.so.6.0.31 libstdc++.so.6.0.30; do
            [ -f "$v" ] && ln -sf "$v" libstdc++.so.6 && break
          done

      - name: AllFonts
        run: |
          echo 'var AllFonts={list:[]};' > dist/opt/onlyoffice/documentbuilder/sdkjs/common/AllFonts.js

      - name: Wrapper
        run: |
          cat > dist/xlsx2pdf << 'W'
          #!/bin/sh
          cd "$(dirname "$0")/opt/onlyoffice/documentbuilder"
          export LD_LIBRARY_PATH="system:."
          exec ./system/ld-linux-aarch64.so.1 ./x2t "$@"
          W
          chmod +x dist/xlsx2pdf

      - name: Package
        run: |
          cd dist && tar -czf ../onlyoffice-documentbuilder-aarch64-musl.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-documentbuilder-aarch64-musl
          path: onlyoffice-documentbuilder-aarch64-musl.tar.gz
