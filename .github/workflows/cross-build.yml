name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  PRODUCT: onlyoffice-documentbuilder

jobs:
  bundle:
    name: Bundle official + glibc for musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64 release
        run: |
          wget -q "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official

      - name: Download Ubuntu aarch64 glibc
        run: |
          mkdir -p glibc
          cd glibc
          wget -q "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04-base-arm64.tar.gz" -O rootfs.tar.gz
          tar -xzf rootfs.tar.gz
          find . -name "*.so*" -o -name "ld-linux*" | head -20

      - name: Bundle everything
        run: |
          BUILDER="opt/onlyoffice/documentbuilder"
          OUTDIR="dist/$BUILDER"
          mkdir -p "$OUTDIR/system"
          cp -r official/$BUILDER/* "$OUTDIR/"
          cp -r glibc/lib/aarch64-linux-gnu/*.so* "$OUTDIR/system/" 2>/dev/null || true
          LDLINUX=$(find glibc -name "ld-linux-aarch64*" -type f | head -1)
          if [ -n "$LDLINUX" ]; then
            cp -v "$LDLINUX" "$OUTDIR/system/"
            cp -v "$LDLINUX" "$OUTDIR/"
          fi

      - name: Patch ELF interpreter
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          BUILDER="dist/opt/onlyoffice/documentbuilder"
          LINKER=$(find "$BUILDER" -name "ld-linux-aarch64*" | head -1)
          LINKER_NAME=$(basename "$LINKER")
          echo "Linker: $LINKER_NAME"
          find "$BUILDER" -type f | while read f; do
            if readelf -h "$f" 2>/dev/null | grep -q "ELF64.*aarch64"; then
              patchelf --set-interpreter "./system/$LINKER_NAME" "$f" 2>/dev/null || true
              patchelf --set-rpath "\$ORIGIN:\$ORIGIN/system" "$f" 2>/dev/null || true
            fi
          done
          readelf -l "$BUILDER/x2t" | grep "interpreter\|INTERP" || true

      - name: Create wrapper scripts + package
        run: |
          cat > dist/xlsx2pdf.sh << 'WRAP'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/opt/onlyoffice/documentbuilder:$DIR/opt/onlyoffice/documentbuilder/system"
          exec "$DIR/opt/onlyoffice/documentbuilder/x2t" "$@"
          WRAP
          chmod +x dist/xlsx2pdf.sh
          
          cat > dist/install.sh << 'INST'
          #!/bin/sh
          DEST="${1:-/opt/onlyoffice/documentbuilder}"
          echo "Installing to $DEST..."
          mkdir -p "$DEST"
          cp -r opt/onlyoffice/documentbuilder/* "$DEST/"
          cp xlsx2pdf.sh /usr/local/bin/xlsx2pdf
          chmod +x /usr/local/bin/xlsx2pdf
          echo "Done."
          INST
          chmod +x dist/install.sh
          
          cd dist
          tar -czf ../${PRODUCT}-aarch64-musl.tar.gz .
          ls -lh ../${PRODUCT}-aarch64-musl.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${PRODUCT}-aarch64-musl
          path: ${PRODUCT}-aarch64-musl.tar.gz
