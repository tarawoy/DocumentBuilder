name: Bundle aarch64-musl

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  bundle:
    name: Build for aarch64-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download official aarch64
        run: |
          set +e
          wget -q "${OURL}" -O official.tar.xz
          mkdir -p official
          tar -xJf official.tar.xz -C official
        env:
          OURL: "https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v9.4.0/onlyoffice-documentbuilder-linux-aarch64.tar.xz"

      - name: Download arm64 glibc debs
        run: |
          set +e
          mkdir -p glibc
          cd glibc
          BASE="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          curl -fSL --retry 3 "$BASE/g/glibc/libc6_2.39-0ubuntu8.7_arm64.deb" -O || true
          curl -fSL --retry 3 "$BASE/g/gcc-14/libgcc-s1_14.2.0-4ubuntu2~24.04.1_arm64.deb" -O || true
          curl -fSL --retry 3 "$BASE/g/gcc-14/libstdc++6_14.2.0-4ubuntu2~24.04.1_arm64.deb" -O || true

      - name: Extract debs
        run: |
          set +e
          mkdir -p glibc-extract
          for deb in glibc/*.deb; do
            dpkg-deb -x "$deb" glibc-extract/ || true
          done

      - name: Copy to dist
        run: |
          set +e
          DEST="dist/opt/onlyoffice/documentbuilder"
          mkdir -p "$DEST/system"
          cp -r official/opt/onlyoffice/documentbuilder/* "$DEST/" 2>/dev/null
          find glibc-extract -type f \( -name "*.so*" -o -name "ld-linux*" \) | while read f; do
            cp "$f" "$DEST/system/" 2>/dev/null || true
          done
          cp "$DEST/system/ld-linux-aarch64.so.1" "$DEST/" 2>/dev/null || true
          cd "$DEST/system"
          for v in libstdc++.so.6.0.33 libstdc++.so.6.0.32 libstdc++.so.6.0.30; do
            [ -f "$v" ] && ln -sf "$v" libstdc++.so.6
          done

      - name: Ensure AllFonts.js + wrapper
        run: |
          set +e
          DEST="dist/opt/onlyoffice/documentbuilder"
          [ ! -f "$DEST/sdkjs/common/AllFonts.js" ] && echo 'var AllFonts={list:[]};' > "$DEST/sdkjs/common/AllFonts.js"
          cat > dist/xlsx2pdf << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          B="$DIR/opt/onlyoffice/documentbuilder"
          cd "$B"
          export LD_LIBRARY_PATH="system:."
          exec ./system/ld-linux-aarch64.so.1 ./x2t "$@"
          EOF
          chmod +x dist/xlsx2pdf

      - name: Package
        run: |
          set +e
          cd dist && tar -czf ../onlyoffice-documentbuilder-aarch64-musl.tar.gz . && ls -lh ../*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-documentbuilder-aarch64-musl
          path: onlyoffice-documentbuilder-aarch64-musl.tar.gz
